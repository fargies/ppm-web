
[env]
# for some reason this is set in defaults
RUST_BACKTRACE = { unset = true }

[tasks.serve]
cwd = "src/app"
command = "npx"
args = [ "vite", "serve" ]

[tasks."serve:dev:vite"]
cwd = "src/app"
command = "npx"
args = [ "vite", "--", "serve", "-w", "--mode", "dev", "--sourcemap", "true" ]

[tasks."serve:dev:ppm-web"]
command = "cargo"
args = [ "run" ]

[tasks."serve:dev:ppm-daemon"]
cwd = "deps/ppm"
command = "cargo"
args = [ "run", "--release", "--bin", "ppm-daemon" ]
env = { "PPM_CONFIG" = "../../tests/test-config.yml", "RUST_LOG" = "ppm::monitor::logger=warn,trace", "PPM_NO_SESSION" = "1" }

[tasks."serve:dev"]
run_task = { name = [ "serve:dev:vite", "serve:dev:ppm-web", "serve:dev:ppm-daemon" ], parallel = true, fork = true }

[tasks."build:ppm"]
cwd = "deps/ppm"
command = "cargo"
args = [ "build" ]

[tasks."serve:test:ppm-daemon"]
extend = "serve:dev:ppm-daemon"
env = { "PPM_CONFIG" = "../../src/app/tests/test-config.yml", "RUST_LOG" = "ppm::monitor::logger=warn,trace", "PPM_NO_SESSION" = "1" }

[tasks."serve:test"]
run_task = { name = [ "serve:dev:ppm-web", "serve:test:ppm-daemon" ], parallel = true, fork = true }

[tasks."build:ppm-web"]
command = "cargo"
args = [ "build" ]

[tasks."build:all"]
run_task = { name = [ "build:ppm-web", "build:ppm" ], parallel = true, fork = true }
