[package]
name = "ppm-web"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
partner-pm = { version = "1.6.0", path = "deps/ppm" }
rust-embed = "8.13.0"
salvo = { version = "1.0.1", features = ["websocket", "trailing-slash", "serve-static", "logging", "affix-state"] }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
anyhow = "1.0.104"

[[test]]
name = "vitest"
path = "tests/vitest.rs"
harness = false
